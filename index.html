<!doctype html>
<meta charset="utf-8">
<title>Oshiuma Lounge</title>
<style>
  :root{
    --bg:#f4f7f6; --card:#ffffff; --line:#dbe6e4;
    --ink:#26363c; --dim:#5e7176; --accent:#3f9189; --err:#c31f00;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#15242b; --card:#1c2e35; --line:#2b424a;
      --ink:#e8efed; --dim:#9eb4b2; --accent:#7fcfc6; --err:#ff6a45;}
  }
  :root[data-theme="light"]{--bg:#f4f7f6; --card:#ffffff; --line:#dbe6e4;
    --ink:#26363c; --dim:#5e7176; --accent:#3f9189; --err:#c31f00;}
  :root[data-theme="dark"]{--bg:#15242b; --card:#1c2e35; --line:#2b424a;
    --ink:#e8efed; --dim:#9eb4b2; --accent:#7fcfc6; --err:#ff6a45;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font-family:Inter,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .card{width:min(92vw,360px);background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:32px 26px;text-align:center;}
  .logo{font-size:1.3rem;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;}
  .sub{font-size:.78rem;color:var(--dim);margin:0 0 22px;}
  input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--line);background:transparent;color:var(--ink);
    text-align:center;letter-spacing:.08em;outline:none;}
  input:focus{border-color:var(--accent);}
  button{width:100%;font:inherit;font-size:1rem;font-weight:600;margin-top:12px;
    padding:12px;border-radius:10px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;}
  button:active{opacity:.85}
  button:disabled{opacity:.5;cursor:wait}
  .hint{font-size:.74rem;color:var(--dim);margin-top:14px;}
  .err{font-size:.78rem;color:var(--err);margin-top:10px;min-height:1.2em;}
  .shake{animation:sh .3s}
  @keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>

<div class="card" id="card">
  <p class="logo">Oshiuma Lounge</p>
  <p class="sub">このページはパスワードで保護されています</p>
  <form id="f">
    <input id="pw" type="password" placeholder="パスワード" autocomplete="off"
      autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" autofocus>
    <button id="btn" type="submit">開く</button>
  </form>
  <p class="hint">ヒント：いつものグループ名（ローマ字）</p>
  <p class="err" id="err"></p>
</div>

  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
    'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:SALT, iterations:200000, hash:'SHA-256'}, base, 512));
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32),
    {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const signed = new Uint8Array(32 + CT.length);
  signed.set(SALT); signed.set(IV, 16); signed.set(CT, 32);
  if(!await crypto.subtle.verify('HMAC', macKey, TAG, signed)) return null;
  const encKey = await crypto.subtle.importKey('raw', bits.slice(0, 32),
    'AES-CBC', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-CBC', iv:IV}, encKey, CT);
  return new TextDecoder().decode(pt);
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '確認中…'; err.textContent = '';
  try{
    const html = await tryDecrypt(document.getElementById('pw').value);
    if(html === null){
      err.textContent = 'パスワードが違います';
      const card = document.getElementById('card');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      document.getElementById('pw').select();
    }else{
      document.open(); document.write(html); document.close();
      return;
    }
  }catch(ex){
    err.textContent = 'エラー: ' + ex.message;
  }
  btn.disabled = false; btn.textContent = '開く';
});
</script>
